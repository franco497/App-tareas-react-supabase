<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>App Tareas - Sistema de Gestión y Recordatorios</title>
    <style>
      /* ✅ RESET INICIAL - Antes de que React cargue */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }

      body {
        /* ✅ SOLUCIÓN 1: dvh para navegadores modernos */
        min-height: 100vh;
        min-height: 100dvh;

        /* ✅ SOLUCIÓN 3: Altura al 100% para cascada */
        height: 100%;

        /* ✅ Prevenir scroll horizontal en cambio de orientación */
        overflow-x: hidden;

        margin: 0;
        padding: 0;
        background: #1a1a2e;
        font-family:
          -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ✅ SOLUCIÓN 3: #root con altura completa y flex */
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
